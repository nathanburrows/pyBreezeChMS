<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#1a0533">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Adventure Time! 🌟</title>
  <style>
/* ===== RESET & BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  background: #1a0533;
  color: #fff;
  overflow-x: hidden;
}

/* ===== SCREEN SYSTEM ===== */
.screen {
  display: none;
  min-height: 100vh;
  padding: 20px 16px 40px;
  max-width: 480px;
  margin: 0 auto;
  flex-direction: column;
  align-items: center;
}
.screen.active { display: flex; }

/* ===== STARS BACKGROUND ===== */
.stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; overflow: hidden; }
.star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle var(--dur) ease-in-out infinite; opacity: 0; }
@keyframes twinkle { 0%, 100% { opacity: 0; } 50% { opacity: var(--max-opacity); } }

/* ===== HOME SCREEN ===== */
#start-screen {
  justify-content: center;
  background: linear-gradient(160deg, #1a0533 0%, #0d1b4b 50%, #0a2a1a 100%);
}
.game-logo { font-size: 72px; margin-bottom: 8px; animation: float 3s ease-in-out infinite; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
.game-title {
  font-size: 2.4rem; font-weight: 900;
  background: linear-gradient(90deg, #ffd700, #ff6b6b, #a78bfa, #34d399);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  line-height: 1.1; margin-bottom: 10px;
}
.game-subtitle { font-size: 1rem; color: #c4b5fd; margin-bottom: 28px; }

/* Home mode cards */
.home-modes { display: flex; flex-direction: column; gap: 12px; width: 100%; }
.mode-card {
  display: flex; align-items: center; gap: 14px;
  background: rgba(255,255,255,0.07);
  border: 2px solid rgba(255,255,255,0.15);
  border-radius: 18px; padding: 16px 18px;
  cursor: pointer; text-align: left; width: 100%;
  transition: transform 0.15s, background 0.2s, border-color 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.mode-card:active { transform: scale(0.97); }
.mode-card:hover { background: rgba(255,255,255,0.13); }
.mode-emoji { font-size: 36px; flex-shrink: 0; }
.mode-info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.mode-title { font-size: 1.1rem; font-weight: 800; color: #fff; }
.mode-desc { font-size: 0.85rem; color: #9ca3af; }
.mode-arrow { font-size: 1.2rem; color: rgba(255,255,255,0.4); flex-shrink: 0; }
.mode-adventure { border-color: rgba(167,139,250,0.5); }
.mode-adventure:hover { border-color: #a78bfa; }
.mode-trivia { border-color: rgba(251,191,36,0.5); }
.mode-trivia:hover { border-color: #fbbf24; }
.mode-math { border-color: rgba(52,211,153,0.5); }
.mode-math:hover { border-color: #34d399; }
.mode-trophy { border-color: rgba(251,146,60,0.5); }
.mode-trophy:hover { border-color: #fb923c; }
.mode-charades { border-color: rgba(251,146,60,0.5); }
.mode-charades:hover { border-color: #fb923c; }
.mode-snake { border-color: rgba(52,211,153,0.5); }
.mode-snake:hover { border-color: #34d399; }
.mode-memory { border-color: rgba(96,165,250,0.5); }
.mode-memory:hover { border-color: #60a5fa; }
.mode-balloon { border-color: rgba(248,113,113,0.5); }
.mode-balloon:hover { border-color: #f87171; }
.mode-reaction { border-color: rgba(251,191,36,0.5); }
.mode-reaction:hover { border-color: #fbbf24; }

/* ===== STORY SELECT SCREEN ===== */
#select-screen { background: linear-gradient(160deg, #0d1b4b 0%, #1a0533 60%, #0a2a1a 100%); }
.select-title { font-size: 1.6rem; font-weight: 800; color: #ffd700; text-align: center; margin-bottom: 6px; }
.select-subtitle { font-size: 0.9rem; color: #c4b5fd; text-align: center; margin-bottom: 22px; }

.story-cards { display: flex; flex-direction: column; gap: 12px; width: 100%; }
.story-card {
  background: rgba(255,255,255,0.07); border: 2px solid rgba(255,255,255,0.15);
  border-radius: 18px; padding: 16px 18px; cursor: pointer;
  transition: transform 0.2s, background 0.2s, border-color 0.2s;
  text-align: left; width: 100%; -webkit-tap-highlight-color: transparent;
}
.story-card:active { transform: scale(0.97); }
.story-card:hover { background: rgba(255,255,255,0.13); }
.story-card.space { border-color: rgba(96,165,250,0.5); }
.story-card.space:hover { border-color: #60a5fa; }
.story-card.dragon { border-color: rgba(248,113,113,0.5); }
.story-card.dragon:hover { border-color: #f87171; }
.story-card.ocean { border-color: rgba(52,211,153,0.5); }
.story-card.ocean:hover { border-color: #34d399; }
.story-card.pirate { border-color: rgba(251,191,36,0.5); }
.story-card.pirate:hover { border-color: #fbbf24; }
.story-card.superhero { border-color: rgba(167,139,250,0.5); }
.story-card.superhero:hover { border-color: #a78bfa; }

.card-emoji { font-size: 40px; display: block; margin-bottom: 6px; }
.card-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 4px; }
.story-card.space .card-title { color: #60a5fa; }
.story-card.dragon .card-title { color: #f87171; }
.story-card.ocean .card-title { color: #34d399; }
.story-card.pirate .card-title { color: #fbbf24; }
.story-card.superhero .card-title { color: #a78bfa; }
.card-desc { font-size: 0.88rem; color: #d1d5db; line-height: 1.4; }

/* ===== GAME SCREEN ===== */
#game-screen { background: linear-gradient(160deg, #0d1b4b 0%, #1a0533 50%, #0a2a1a 100%); justify-content: flex-start; }

.story-header {
  display: flex; align-items: center; gap: 8px;
  width: 100%; margin-bottom: 16px; margin-top: 6px;
  flex-wrap: wrap;
}
.back-btn {
  background: rgba(255,255,255,0.1); border: none; color: #fff;
  font-size: 1rem; padding: 8px 12px; border-radius: 12px;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: background 0.2s; flex-shrink: 0;
}
.back-btn:active { background: rgba(255,255,255,0.2); }
.story-name-badge { font-size: 0.85rem; font-weight: 700; padding: 6px 12px; border-radius: 20px; flex: 1; }
.badge-space { background: #1e3a8a; color: #93c5fd; }
.badge-dragon { background: #7f1d1d; color: #fca5a5; }
.badge-ocean { background: #064e3b; color: #6ee7b7; }
.badge-pirate { background: #713f12; color: #fde68a; }
.badge-superhero { background: #4c1d95; color: #c4b5fd; }
.trivia-score-badge { background: rgba(253,224,71,0.15); color: #fde047; font-size: 0.85rem; font-weight: 700; padding: 6px 10px; border-radius: 20px; border: 1px solid rgba(253,224,71,0.3); white-space: nowrap; }

/* Scene card */
.scene-card {
  background: rgba(255,255,255,0.06); border-radius: 22px;
  padding: 22px 18px; width: 100%; margin-bottom: 18px;
  border: 1px solid rgba(255,255,255,0.1);
  opacity: 0; transform: translateY(20px);
  transition: opacity 0.4s ease, transform 0.4s ease;
}
.scene-card.visible { opacity: 1; transform: translateY(0); }
.scene-emoji { font-size: 52px; display: block; text-align: center; margin-bottom: 10px; }
.scene-title { font-size: 1.25rem; font-weight: 800; text-align: center; margin-bottom: 10px; color: #ffd700; }
.scene-text { font-size: 1rem; line-height: 1.65; color: #e5e7eb; }

/* Choices */
.choices-container {
  display: flex; flex-direction: column; gap: 11px; width: 100%;
  opacity: 0; transform: translateY(16px);
  transition: opacity 0.35s ease 0.2s, transform 0.35s ease 0.2s;
}
.choices-container.visible { opacity: 1; transform: translateY(0); }
.choice-btn {
  background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.2);
  color: #fff; font-size: 0.98rem; font-weight: 600;
  padding: 15px 16px; border-radius: 14px; cursor: pointer;
  text-align: left; line-height: 1.4;
  transition: background 0.2s, transform 0.15s, border-color 0.2s;
  -webkit-tap-highlight-color: transparent; width: 100%;
}
.choice-btn:active { transform: scale(0.97); }
.theme-space .choice-btn:hover { border-color: #60a5fa; background: rgba(96,165,250,0.15); }
.theme-dragon .choice-btn:hover { border-color: #f87171; background: rgba(248,113,113,0.15); }
.theme-ocean .choice-btn:hover { border-color: #34d399; background: rgba(52,211,153,0.15); }
.theme-pirate .choice-btn:hover { border-color: #fbbf24; background: rgba(251,191,36,0.15); }
.theme-superhero .choice-btn:hover { border-color: #a78bfa; background: rgba(167,139,250,0.15); }

/* Progress dots */
.progress-dots { display: flex; gap: 5px; justify-content: center; margin-bottom: 14px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.18); transition: background 0.3s; }
.dot.filled { background: #ffd700; }

/* ===== TRIVIA SCREEN (in-adventure) ===== */
#trivia-screen { background: linear-gradient(160deg, #0d1b4b 0%, #1a0533 60%, #0a1a0a 100%); justify-content: flex-start; }
.trivia-header { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 20px; margin-top: 6px; }
.trivia-badge { background: rgba(251,191,36,0.2); color: #fbbf24; font-size: 0.95rem; font-weight: 800; padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(251,191,36,0.4); }
.trivia-score { color: #fde047; font-weight: 700; font-size: 1rem; }
.trivia-card {
  background: rgba(255,255,255,0.06); border-radius: 22px;
  padding: 24px 18px; width: 100%; margin-bottom: 16px;
  border: 1px solid rgba(251,191,36,0.2);
  opacity: 0; transform: translateY(20px);
  transition: opacity 0.4s ease, transform 0.4s ease;
}
.trivia-card.visible { opacity: 1; transform: translateY(0); }
.trivia-question { font-size: 1.1rem; font-weight: 700; line-height: 1.5; color: #fff; margin-bottom: 20px; text-align: center; }
.trivia-choices { display: flex; flex-direction: column; gap: 10px; }
.trivia-btn {
  background: rgba(255,255,255,0.08); border: 2px solid rgba(251,191,36,0.3);
  color: #fff; font-size: 0.98rem; font-weight: 600;
  padding: 14px 16px; border-radius: 14px; cursor: pointer;
  text-align: left; transition: background 0.2s, border-color 0.2s, transform 0.15s;
  -webkit-tap-highlight-color: transparent; width: 100%;
}
.trivia-btn:not(:disabled):hover { border-color: #fbbf24; background: rgba(251,191,36,0.15); }
.trivia-btn:not(:disabled):active { transform: scale(0.97); }
.trivia-btn.trivia-correct { background: rgba(52,211,153,0.25); border-color: #34d399; color: #6ee7b7; }
.trivia-btn.trivia-wrong { background: rgba(248,113,113,0.2); border-color: #f87171; color: #fca5a5; }
.trivia-fact {
  margin-top: 18px; padding: 16px; border-radius: 14px; font-size: 0.95rem; line-height: 1.55;
}
.fact-correct { background: rgba(52,211,153,0.15); border: 1px solid rgba(52,211,153,0.3); color: #d1fae5; }
.fact-wrong { background: rgba(167,139,250,0.15); border: 1px solid rgba(167,139,250,0.3); color: #ede9fe; }
.trivia-fact p:first-child { font-weight: 800; font-size: 1.05rem; margin-bottom: 8px; }
.fact-text { color: #e5e7eb; }
.trivia-hint { font-size: 0.85rem; color: #9ca3af; text-align: center; }

/* ===== TRIVIA MODE SCREEN ===== */
#trivia-mode-screen { background: linear-gradient(160deg, #0d1b4b 0%, #1a0533 60%, #0a1a0a 100%); justify-content: flex-start; }

.mode-header { display: flex; align-items: center; gap: 10px; width: 100%; margin-bottom: 20px; margin-top: 6px; }
.mode-title-badge { font-size: 1.1rem; font-weight: 800; padding: 6px 16px; border-radius: 20px; background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); }
.mode-title-badge-math { background: rgba(52,211,153,0.15); color: #34d399; border-color: rgba(52,211,153,0.3); }

.category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; margin-bottom: 20px; }
.category-btn {
  background: rgba(255,255,255,0.07); border: 2px solid rgba(255,255,255,0.15);
  border-radius: 16px; padding: 18px 14px; cursor: pointer;
  text-align: center; font-size: 0.95rem; font-weight: 700; color: #fff;
  transition: transform 0.15s, background 0.2s; -webkit-tap-highlight-color: transparent;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.category-btn:active { transform: scale(0.95); }
.category-btn:hover { background: rgba(255,255,255,0.13); }
.category-btn .cat-emoji { font-size: 36px; }
.cat-all { border-color: rgba(251,191,36,0.5); }
.cat-animals { border-color: rgba(52,211,153,0.5); }
.cat-space { border-color: rgba(96,165,250,0.5); }
.cat-science { border-color: rgba(167,139,250,0.5); }
.cat-ocean { border-color: rgba(34,211,238,0.5); }
.cat-fun { border-color: rgba(248,113,113,0.5); }

/* Trivia game in progress */
.trivia-game-header { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 16px; }
.trivia-progress-text { font-size: 0.9rem; font-weight: 700; color: #c4b5fd; }
.trivia-live-score { font-size: 0.9rem; font-weight: 700; color: #fde047; }
.trivia-progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-bottom: 18px; }
.trivia-progress-fill { height: 100%; background: linear-gradient(90deg, #fbbf24, #a78bfa); border-radius: 3px; transition: width 0.4s ease; }

/* Results screen */
.results-card {
  background: rgba(255,255,255,0.06); border-radius: 22px;
  padding: 28px 20px; width: 100%; text-align: center;
  border: 1px solid rgba(255,255,255,0.15);
}
.results-emoji { font-size: 72px; display: block; margin-bottom: 12px; }
.results-title { font-size: 1.8rem; font-weight: 900; color: #ffd700; margin-bottom: 10px; }
.results-score-big { font-size: 3rem; font-weight: 900; color: #fbbf24; margin: 12px 0; }
.results-text { font-size: 1rem; color: #d1d5db; line-height: 1.6; margin-bottom: 24px; }
.results-breakdown { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
.result-stat { background: rgba(255,255,255,0.08); border-radius: 12px; padding: 12px 16px; text-align: center; }
.stat-num { font-size: 1.6rem; font-weight: 900; display: block; }
.stat-label { font-size: 0.78rem; color: #9ca3af; }
.stat-correct .stat-num { color: #34d399; }
.stat-wrong .stat-num { color: #f87171; }
.stat-score .stat-num { color: #fbbf24; }

/* ===== MATH MODE SCREEN ===== */
#math-mode-screen { background: linear-gradient(160deg, #0a2a1a 0%, #1a0533 50%, #0d1b4b 100%); justify-content: flex-start; }

.difficulty-grid { display: flex; flex-direction: column; gap: 12px; width: 100%; }
.difficulty-btn {
  display: flex; align-items: center; gap: 14px;
  background: rgba(255,255,255,0.07); border: 2px solid rgba(255,255,255,0.15);
  border-radius: 16px; padding: 16px 18px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.15s, background 0.2s; width: 100%;
}
.difficulty-btn:active { transform: scale(0.97); }
.diff-emoji { font-size: 36px; }
.diff-info { text-align: left; }
.diff-name { font-size: 1.1rem; font-weight: 800; color: #fff; margin-bottom: 2px; }
.diff-desc { font-size: 0.85rem; color: #9ca3af; }
.diff-easy { border-color: rgba(52,211,153,0.5); }
.diff-medium { border-color: rgba(251,191,36,0.5); }
.diff-hard { border-color: rgba(248,113,113,0.5); }

/* Math game */
.math-header { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 14px; }
.math-score-display { font-size: 0.9rem; font-weight: 700; color: #fde047; }
.math-timer-display { font-size: 0.9rem; font-weight: 700; }
.timer-ok { color: #34d399; }
.timer-warn { color: #fbbf24; }
.timer-danger { color: #f87171; animation: flash 0.5s ease-in-out infinite; }
@keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

.math-progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-bottom: 18px; }
.math-progress-fill { height: 100%; background: linear-gradient(90deg, #34d399, #60a5fa); border-radius: 3px; transition: width 0.3s ease; }

.math-question-card {
  background: rgba(255,255,255,0.06); border-radius: 22px;
  padding: 30px 20px; width: 100%; margin-bottom: 18px;
  border: 1px solid rgba(52,211,153,0.2); text-align: center;
}
.math-problem { font-size: 2.2rem; font-weight: 900; color: #fff; margin-bottom: 10px; letter-spacing: 2px; }
.math-streak { font-size: 0.85rem; color: #fbbf24; font-weight: 700; min-height: 20px; }

.math-answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.math-btn {
  background: rgba(255,255,255,0.08); border: 2px solid rgba(52,211,153,0.3);
  color: #fff; font-size: 1.4rem; font-weight: 900;
  padding: 18px 10px; border-radius: 14px; cursor: pointer;
  transition: background 0.15s, transform 0.12s, border-color 0.15s;
  -webkit-tap-highlight-color: transparent; text-align: center;
}
.math-btn:not(:disabled):active { transform: scale(0.94); }
.math-btn:not(:disabled):hover { border-color: #34d399; background: rgba(52,211,153,0.15); }
.math-btn.math-correct { background: rgba(52,211,153,0.3); border-color: #34d399; }
.math-btn.math-wrong { background: rgba(248,113,113,0.25); border-color: #f87171; }
.math-feedback { font-size: 1rem; font-weight: 700; text-align: center; min-height: 28px; margin-top: 10px; padding: 6px; }
.feedback-correct { color: #34d399; }
.feedback-wrong { color: #f87171; }

/* ===== ENDING SCREEN ===== */
#ending-screen { justify-content: center; text-align: center; }
.ending-bg-great { background: linear-gradient(160deg, #1c1c00 0%, #2d1a00 50%, #001a1a 100%); }
.ending-bg-good { background: linear-gradient(160deg, #0a1a0a 0%, #1a1a2e 50%, #1a0a2e 100%); }
.ending-fireworks { font-size: 36px; letter-spacing: 3px; margin-bottom: 10px; animation: pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
.ending-badge { display: inline-block; padding: 7px 20px; border-radius: 30px; font-size: 0.82rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 16px; }
.badge-great { background: linear-gradient(90deg, #ffd700, #ff8c00); color: #1a0000; }
.badge-good { background: linear-gradient(90deg, #a78bfa, #60a5fa); color: #0a001a; }
.ending-emoji { font-size: 72px; margin-bottom: 12px; display: block; }
.ending-title { font-size: 1.9rem; font-weight: 900; margin-bottom: 12px; line-height: 1.15; color: #ffd700; }
.ending-text { font-size: 1rem; color: #e5e7eb; line-height: 1.65; margin-bottom: 16px; max-width: 380px; }
.trivia-final-score { background: rgba(253,224,71,0.1); border: 1px solid rgba(253,224,71,0.3); color: #fde047; font-size: 0.95rem; font-weight: 700; padding: 10px 20px; border-radius: 20px; margin-bottom: 24px; }
.ending-buttons { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 340px; }

/* ===== ACHIEVEMENTS SCREEN ===== */
#achievements-screen { background: linear-gradient(160deg, #1a0533 0%, #0d1b4b 50%, #0a2a1a 100%); justify-content: flex-start; }
.ach-header { display: flex; align-items: center; gap: 12px; width: 100%; margin-bottom: 8px; margin-top: 6px; }
.ach-title { font-size: 1.4rem; font-weight: 900; color: #ffd700; }
.ach-subtitle { font-size: 0.9rem; color: #c4b5fd; margin-bottom: 10px; }
.ach-progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; margin-bottom: 22px; }
.ach-progress-fill { height: 100%; background: linear-gradient(90deg, #ffd700, #ff6b6b, #a78bfa); border-radius: 4px; transition: width 0.6s ease; }
.ach-story-section { width: 100%; margin-bottom: 20px; }
.ach-story-title { font-size: 1.05rem; font-weight: 800; color: #c4b5fd; margin-bottom: 10px; }
.ach-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ach-item {
  border-radius: 14px; padding: 14px 12px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.ach-item.found { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); }
.ach-item.locked { background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.1); }
.ach-emoji { font-size: 28px; }
.ach-name { font-size: 0.78rem; font-weight: 700; color: #d1d5db; line-height: 1.3; }
.ach-item.locked .ach-name { color: rgba(255,255,255,0.3); }
.ach-type-badge { font-size: 0.68rem; font-weight: 800; padding: 2px 8px; border-radius: 10px; }

/* ===== BUTTONS ===== */
.btn-primary {
  background: linear-gradient(90deg, #7c3aed, #4f46e5); color: #fff; border: none;
  font-size: 1.1rem; font-weight: 800; padding: 17px 28px; border-radius: 14px;
  cursor: pointer; width: 100%; transition: transform 0.15s, opacity 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.btn-primary:active { transform: scale(0.96); }
.btn-primary:hover { opacity: 0.9; }
.btn-secondary {
  background: rgba(255,255,255,0.1); color: #d1d5db;
  border: 2px solid rgba(255,255,255,0.2); font-size: 0.95rem; font-weight: 700;
  padding: 13px 24px; border-radius: 14px; cursor: pointer; width: 100%;
  transition: transform 0.15s, background 0.2s; -webkit-tap-highlight-color: transparent;
}
.btn-secondary:active { transform: scale(0.96); }
.btn-secondary:hover { background: rgba(255,255,255,0.16); }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

/* ===== CHARADES ===== */
#charades-screen { background: linear-gradient(135deg, #1e0a3c 0%, #2d1257 50%, #1a0a2e 100%); }
.charades-header { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 16px; margin-top: 6px; }
.charades-timer-val { font-size: 2rem; font-weight: 900; color: #fbbf24; min-width: 60px; text-align: center; }
.charades-timer-val.urgent { color: #f87171; animation: flash 0.5s ease-in-out infinite; }
.charades-word-card { background: linear-gradient(135deg, rgba(139,92,246,0.3), rgba(109,40,217,0.4)); border: 2px solid rgba(167,139,250,0.4); border-radius: 24px; padding: 40px 24px; width: 100%; text-align: center; box-shadow: 0 8px 32px rgba(139,92,246,0.3); min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 16px; transition: background 0.3s; }
.charades-word { font-size: 2.4rem; font-weight: 900; color: #fff; line-height: 1.2; margin-bottom: 10px; transition: opacity 0.2s, transform 0.2s; }
.charades-category-pill { display: inline-block; padding: 4px 14px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
.charades-category-pill.animals { background: #34d399; color: #064e3b; }
.charades-category-pill.movies  { background: #f87171; color: #7f1d1d; }
.charades-category-pill.actions { background: #60a5fa; color: #1e3a8a; }
.charades-category-pill.silly   { background: #fbbf24; color: #78350f; }
.charades-tilt-hint { display: flex; gap: 12px; width: 100%; margin-bottom: 14px; }
.tilt-hint-card { flex: 1; padding: 12px 10px; border-radius: 16px; text-align: center; font-size: 0.85rem; font-weight: 700; line-height: 1.4; }
.tilt-hint-card.correct-hint { background: rgba(52,211,153,0.15); border: 2px solid rgba(52,211,153,0.4); color: #6ee7b7; }
.tilt-hint-card.skip-hint { background: rgba(248,113,113,0.15); border: 2px solid rgba(248,113,113,0.4); color: #fca5a5; }
.tilt-hint-icon { font-size: 1.6rem; display: block; margin-bottom: 4px; }
.charades-buttons { display: flex; gap: 14px; width: 100%; }
.btn-charades-skip { flex: 1; padding: 18px 10px; border: none; border-radius: 18px; font-size: 1.1rem; font-weight: 900; cursor: pointer; background: linear-gradient(135deg, #f87171, #ef4444); color: #fff; box-shadow: 0 4px 16px rgba(239,68,68,0.4); transition: transform 0.12s; -webkit-tap-highlight-color: transparent; }
.btn-charades-correct { flex: 1; padding: 18px 10px; border: none; border-radius: 18px; font-size: 1.1rem; font-weight: 900; cursor: pointer; background: linear-gradient(135deg, #34d399, #10b981); color: #fff; box-shadow: 0 4px 16px rgba(16,185,129,0.4); transition: transform 0.12s; -webkit-tap-highlight-color: transparent; }
.btn-charades-skip:active, .btn-charades-correct:active { transform: scale(0.95); }
.charades-cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; margin-bottom: 24px; }
.charades-cat-btn { padding: 22px 10px; border: none; border-radius: 18px; font-size: 1.15rem; font-weight: 800; cursor: pointer; color: #fff; transition: transform 0.15s; -webkit-tap-highlight-color: transparent; }
.charades-cat-btn:active { transform: scale(0.93); }
.charades-cat-btn.cat-animals { background: linear-gradient(135deg, #34d399, #059669); }
.charades-cat-btn.cat-movies  { background: linear-gradient(135deg, #f87171, #dc2626); }
.charades-cat-btn.cat-actions { background: linear-gradient(135deg, #60a5fa, #2563eb); }
.charades-cat-btn.cat-silly   { background: linear-gradient(135deg, #fbbf24, #d97706); }
.charades-cat-btn.cat-all     { grid-column: 1 / -1; background: linear-gradient(135deg, #a78bfa, #7c3aed); }

/* ===== SNAKE ===== */
#snake-screen { background: #0a0a0f; }
.snake-header { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 10px; }
.snake-score-box { text-align: center; }
.snake-score-box .s-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: #6ee7b7; font-weight: 700; }
.snake-score-box .s-value { font-size: 1.5rem; font-weight: 900; color: #fff; }
#snake-canvas { border: 3px solid #34d399; border-radius: 8px; box-shadow: 0 0 24px rgba(52,211,153,0.3); display: block; touch-action: none; }
.snake-canvas-wrap { position: relative; margin: 0 auto; }
.snake-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.82); display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; text-align: center; padding: 20px; backdrop-filter: blur(4px); }
.dpad-grid { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 6px; margin: 12px auto 0; }
.dpad-btn { width: 56px; height: 56px; border: 2px solid rgba(52,211,153,0.35); border-radius: 12px; background: rgba(52,211,153,0.15); color: #34d399; font-size: 1.4rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.1s, transform 0.1s; -webkit-tap-highlight-color: transparent; }
.dpad-btn:active { background: rgba(52,211,153,0.35); transform: scale(0.9); }
.dpad-blank { background: transparent; pointer-events: none; }

/* ===== MEMORY MATCH ===== */
#memory-screen { background: linear-gradient(135deg, #0f172a, #1e3a5f); }
.memory-header { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 12px; margin-top: 6px; }
.memory-stat .m-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: #93c5fd; font-weight: 700; }
.memory-stat .m-value { font-size: 1.4rem; font-weight: 900; color: #fff; }
.memory-grid { display: grid; gap: 8px; width: 100%; }
.memory-grid.easy { grid-template-columns: repeat(4, 1fr); }
.memory-grid.hard { grid-template-columns: repeat(4, 1fr); }
.memory-card { aspect-ratio: 1; perspective: 600px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.memory-card-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.4s ease; border-radius: 12px; }
.memory-card.flipped .memory-card-inner, .memory-card.matched .memory-card-inner { transform: rotateY(180deg); }
.memory-card-front, .memory-card-back { position: absolute; inset: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.memory-card-front { background: linear-gradient(135deg, #1e40af, #1d4ed8); border: 2px solid rgba(96,165,250,0.3); }
.memory-card-back { background: linear-gradient(135deg, #1e3a5f, #0f2a4a); border: 2px solid rgba(96,165,250,0.2); transform: rotateY(180deg); }
.memory-card.matched .memory-card-front { background: linear-gradient(135deg, #065f46, #047857); border-color: rgba(52,211,153,0.5); box-shadow: 0 0 12px rgba(52,211,153,0.4); }
.memory-diff-btn { display: block; width: 100%; padding: 20px; margin-bottom: 14px; border: none; border-radius: 18px; font-size: 1.1rem; font-weight: 800; cursor: pointer; color: #fff; transition: transform 0.12s; -webkit-tap-highlight-color: transparent; }
.memory-diff-btn:active { transform: scale(0.95); }
.memory-diff-btn.easy { background: linear-gradient(135deg, #34d399, #059669); }
.memory-diff-btn.hard { background: linear-gradient(135deg, #f87171, #dc2626); }

/* ===== BALLOON POP ===== */
#balloon-screen { background: linear-gradient(180deg, #0c1445 0%, #1a237e 50%, #283593 100%); overflow: hidden; }
.balloon-hud { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 10px; }
.balloon-hud-stat { text-align: center; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 8px 14px; }
.balloon-hud-stat .b-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: #fca5a5; font-weight: 700; }
.balloon-hud-stat .b-value { font-size: 1.4rem; font-weight: 900; color: #fff; }
.balloon-hud-stat .b-value.combo { color: #fbbf24; }
#balloon-field { position: relative; width: 100%; height: 420px; overflow: hidden; border-radius: 16px; background: rgba(255,255,255,0.02); touch-action: none; }
.balloon-item { position: absolute; font-size: 2.4rem; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; animation: balloonRise linear forwards; }
@keyframes balloonRise { from { bottom: -60px; } to { bottom: 110%; } }
.balloon-item.popped { animation: balloonPop 0.35s ease-out forwards !important; pointer-events: none; }
@keyframes balloonPop { 0% { transform: scale(1); opacity: 1; } 40% { transform: scale(1.6); opacity: 0.8; } 100% { transform: scale(0.1); opacity: 0; } }
.balloon-score-float { position: absolute; font-size: 1rem; font-weight: 900; color: #fbbf24; text-shadow: 0 2px 6px rgba(0,0,0,0.6); pointer-events: none; animation: floatUp 0.9s ease-out forwards; z-index: 20; }
@keyframes floatUp { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-60px); } }

/* ===== REACTION TEST ===== */
#reaction-screen { background: #0f172a; }
#reaction-pad { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; transition: background 0.2s; text-align: center; padding: 24px; min-height: 320px; border-radius: 20px; margin: 12px 0; }
#reaction-pad.waiting  { background: linear-gradient(135deg, #991b1b, #7f1d1d); }
#reaction-pad.ready    { background: linear-gradient(135deg, #065f46, #064e3b); }
#reaction-pad.toosoon  { background: linear-gradient(135deg, #92400e, #78350f); }
#reaction-pad.idle     { background: linear-gradient(135deg, #1e293b, #0f172a); border: 2px dashed rgba(255,255,255,0.15); }
.reaction-emoji-big { font-size: 4.5rem; display: block; margin-bottom: 12px; }
.reaction-main-text { font-size: 1.8rem; font-weight: 900; color: #fff; margin-bottom: 8px; }
.reaction-sub-text { font-size: 1rem; color: rgba(255,255,255,0.7); }
.reaction-result-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.07); border-radius: 10px; padding: 10px 16px; font-size: 1rem; color: #e5e7eb; margin-bottom: 6px; }
.reaction-ms { font-weight: 900; color: #fbbf24; }

/* ===== NEW TRIVIA CATEGORY BUTTONS ===== */
.cat-movies { border-color: rgba(244,63,94,0.5) !important; }
.cat-movies:hover { border-color: #f43f5e !important; }
.cat-disney { border-color: rgba(6,182,212,0.5) !important; }
.cat-disney:hover { border-color: #06b6d4 !important; }

  </style>
</head>
<body>
<div class="stars"></div>
<div id="start-screen" class="screen active">
  <div class="game-logo">🌟</div>
  <h1 class="game-title">Adventure Time!</h1>
  <p class="game-subtitle">Choose your game and start playing!</p>
  <div class="home-modes">
    <button class="mode-card mode-adventure" onclick="startGame()">
      <span class="mode-emoji">🗺️</span>
      <div class="mode-info"><span class="mode-title">Story Adventures</span><span class="mode-desc">5 choose-your-own stories</span></div>
      <span class="mode-arrow">→</span>
    </button>
    <button class="mode-card mode-trivia" onclick="startTriviaMode()">
      <span class="mode-emoji">🧠</span>
      <div class="mode-info"><span class="mode-title">Trivia Challenge</span><span class="mode-desc">Animals, Space, Science &amp; more</span></div>
      <span class="mode-arrow">→</span>
    </button>
    <button class="mode-card mode-math" onclick="startMathMode()">
      <span class="mode-emoji">🔢</span>
      <div class="mode-info"><span class="mode-title">Math Challenge</span><span class="mode-desc">Beat the clock with numbers!</span></div>
      <span class="mode-arrow">→</span>
    </button>
    <button class="mode-card mode-trophy" onclick="showAchievements()">
      <span class="mode-emoji">🏆</span>
      <div class="mode-info"><span class="mode-title">Trophy Room</span><span class="mode-desc">See all your endings found</span></div>
      <span class="mode-arrow">→</span>
    </button>
    <button class="mode-card mode-charades" onclick="startCharades()">
      <span class="mode-emoji">🎭</span>
      <div class="mode-info"><span class="mode-title">Charades</span><span class="mode-desc">Tilt phone to guess words!</span></div>
      <span class="mode-arrow">→</span>
    </button>
    <button class="mode-card mode-snake" onclick="startSnakeGame()">
      <span class="mode-emoji">🐍</span>
      <div class="mode-info"><span class="mode-title">Snake</span><span class="mode-desc">Eat food, don't crash!</span></div>
      <span class="mode-arrow">→</span>
    </button>
    <button class="mode-card mode-memory" onclick="startMemory()">
      <span class="mode-emoji">🃏</span>
      <div class="mode-info"><span class="mode-title">Memory Match</span><span class="mode-desc">Find all the pairs!</span></div>
      <span class="mode-arrow">→</span>
    </button>
    <button class="mode-card mode-balloon" onclick="startBalloonPop()">
      <span class="mode-emoji">🎈</span>
      <div class="mode-info"><span class="mode-title">Balloon Pop</span><span class="mode-desc">Pop 'em before they escape!</span></div>
      <span class="mode-arrow">→</span>
    </button>
    <button class="mode-card mode-reaction" onclick="startReaction()">
      <span class="mode-emoji">⚡</span>
      <div class="mode-info"><span class="mode-title">Reaction Test</span><span class="mode-desc">How fast can you tap?</span></div>
      <span class="mode-arrow">→</span>
    </button>
  </div>
</div>
<div id="select-screen" class="screen">
  <div class="story-header">
    <button class="back-btn" onclick="showScreen('start')">← Back</button>
  </div>
  <h2 class="select-title">Pick Your Adventure!</h2>
  <p class="select-subtitle">Each story has multiple secret endings to discover 🔍</p>
  <div class="story-cards">
    <button class="story-card space" onclick="pickStory('space')"><span class="card-emoji">🚀</span><div class="card-title">Space Explorer</div><div class="card-desc">Blast off and discover alien worlds, candy planets, and glowing creatures! 4 endings to find.</div></button>
    <button class="story-card dragon" onclick="pickStory('dragon')"><span class="card-emoji">🐉</span><div class="card-title">Dragon Quest</div><div class="card-desc">Help Ember the dragon find magic fire before winter arrives! 5 endings to find.</div></button>
    <button class="story-card ocean" onclick="pickStory('ocean')"><span class="card-emoji">🌊</span><div class="card-title">Ocean Depths</div><div class="card-desc">Dive deep in your yellow submarine and make amazing ocean friends! 4 endings to find.</div></button>
    <button class="story-card pirate" onclick="pickStory('pirate')"><span class="card-emoji">🏴‍☠️</span><div class="card-title">Pirate Adventure</div><div class="card-desc">Sail the seas as the youngest captain ever and find legendary treasure! 4 endings to find.</div></button>
    <button class="story-card superhero" onclick="pickStory('superhero')"><span class="card-emoji">🦸</span><div class="card-title">Superhero Training</div><div class="card-desc">Discover your superpower and train to save the day! 3 endings to find.</div></button>
  </div>
</div>
<div id="game-screen" class="screen"></div>
<div id="trivia-screen" class="screen"></div>
<div id="trivia-mode-screen" class="screen"></div>
<div id="math-mode-screen" class="screen"></div>
<div id="ending-screen" class="screen"></div>
<div id="achievements-screen" class="screen"></div>
<div id="charades-screen" class="screen"></div>
<div id="snake-screen" class="screen"></div>
<div id="memory-screen" class="screen"></div>
<div id="balloon-screen" class="screen"></div>
<div id="reaction-screen" class="screen"></div>
<script>
/* ===================================================
   ADVENTURE GAME - CHOOSE YOUR OWN STORY!
   For kids ages 8-10
   5 adventures · Trivia mini-games · Achievements
=================================================== */

// ===== TRIVIA QUESTIONS =====
const TRIVIA = [
  // Animals
  { q: "How many legs does a spider have?", a: 1, choices: ["6 legs", "8 legs", "10 legs"], fact: "Spiders have 8 legs! They use all of them to spin amazing webs! 🕷️" },
  { q: "Which animal is the fastest on land?", a: 0, choices: ["Cheetah", "Lion", "Horse"], fact: "The cheetah can run up to 75 mph (120 km/h)! That's faster than a car! 🐆" },
  { q: "How long do sea turtles live?", a: 2, choices: ["10 years", "30 years", "Over 100 years"], fact: "Sea turtles can live over 100 years! Some are older than your great-great-grandparents! 🐢" },
  { q: "Which animal has the biggest brain compared to its body?", a: 1, choices: ["Elephant", "Dolphin", "Whale"], fact: "Dolphins have the biggest brain-to-body ratio! They can recognize themselves in mirrors! 🐬" },
  { q: "How many hearts does an octopus have?", a: 2, choices: ["1 heart", "2 hearts", "3 hearts"], fact: "Octopuses have THREE hearts! Two pump blood to the gills, one to the rest of the body! 🐙" },
  { q: "A group of flamingos is called a...?", a: 0, choices: ["Flamboyance", "Flock", "Party"], fact: "A group of flamingos is called a flamboyance! What an amazing word! 🦩" },
  { q: "Which bird can fly backwards?", a: 2, choices: ["Eagle", "Parrot", "Hummingbird"], fact: "Hummingbirds are the only birds that can fly backwards and even upside down! 🦜" },
  { q: "How many teeth can a shark grow in its lifetime?", a: 2, choices: ["20 teeth", "200 teeth", "Up to 50,000 teeth"], fact: "Sharks can grow up to 50,000 teeth in their lifetime — they keep growing new ones! 🦈" },
  // Space
  { q: "How many planets are in our solar system?", a: 1, choices: ["7 planets", "8 planets", "9 planets"], fact: "There are 8 planets! Pluto is now called a 'dwarf planet.' Sorry Pluto! 🪐" },
  { q: "The Sun is a...?", a: 2, choices: ["Planet", "Moon", "Star"], fact: "The Sun is a star — just like all the stars you see at night, only much closer! ⭐" },
  { q: "Which planet has rings around it?", a: 0, choices: ["Saturn", "Jupiter", "Mars"], fact: "Saturn has the most beautiful rings, made of billions of chunks of ice and rock! 🪐" },
  { q: "How long does it take light from the Sun to reach Earth?", a: 1, choices: ["1 second", "About 8 minutes", "1 hour"], fact: "Sunlight takes about 8 minutes to travel 93 million miles to reach Earth! 🌞" },
  { q: "What is the largest planet in our solar system?", a: 0, choices: ["Jupiter", "Saturn", "Neptune"], fact: "Jupiter is SO big that 1,300 Earths could fit inside it! It also has a giant storm called the Great Red Spot! 🌪️" },
  { q: "How many moons does Earth have?", a: 1, choices: ["0 moons", "1 moon", "3 moons"], fact: "Earth has exactly 1 moon! But Mars has 2, and Jupiter has over 90 moons! 🌙" },
  // Ocean
  { q: "How much of Earth's surface is covered by ocean?", a: 2, choices: ["30%", "50%", "Over 70%"], fact: "Over 70% of Earth is ocean! That's why Earth is called the Blue Planet! 🌊" },
  { q: "What is the deepest part of the ocean called?", a: 0, choices: ["Mariana Trench", "Atlantic Valley", "Pacific Pit"], fact: "The Mariana Trench is 36,000 feet deep — Mount Everest could fit inside it! 🌊" },
  { q: "Which is the largest ocean?", a: 1, choices: ["Atlantic Ocean", "Pacific Ocean", "Indian Ocean"], fact: "The Pacific Ocean is so large that all the world's continents could fit inside it! 🌏" },
  { q: "How do clownfish protect themselves?", a: 2, choices: ["They're very fast", "They have sharp teeth", "They hide in sea anemones"], fact: "Clownfish live in sea anemones that would sting other fish — but not clownfish! 🐠" },
  // Science
  { q: "What is the hardest natural substance on Earth?", a: 0, choices: ["Diamond", "Gold", "Steel"], fact: "Diamonds are the hardest natural material! They're made of compressed carbon deep underground! 💎" },
  { q: "How many colors are in a rainbow?", a: 1, choices: ["5 colors", "7 colors", "10 colors"], fact: "Rainbows have 7 colors: Red, Orange, Yellow, Green, Blue, Indigo, and Violet! 🌈" },
  { q: "What do plants need to make their food?", a: 2, choices: ["Only water", "Water and dirt", "Sunlight, water, and air"], fact: "Plants use sunlight, water, and carbon dioxide to make their own food — called photosynthesis! 🌱" },
  { q: "What is the smallest planet in our solar system?", a: 0, choices: ["Mercury", "Mars", "Venus"], fact: "Mercury is the smallest planet and closest to the Sun, but Venus is actually hotter! 🪨" },
  { q: "Lightning is hotter than...?", a: 2, choices: ["A campfire", "The Sun's surface", "5 times hotter than the Sun's surface"], fact: "Lightning is about 5 times hotter than the surface of the Sun — reaching 53,000°F! ⚡" },
  { q: "What is water made of?", a: 1, choices: ["Carbon and oxygen", "Hydrogen and oxygen", "Hydrogen and nitrogen"], fact: "Water is H₂O — 2 hydrogen atoms and 1 oxygen atom! All water on Earth is millions of years old! 💧" },
  // Fun facts
  { q: "Honey never expires — archaeologists found 3,000-year-old honey that was still...?", a: 0, choices: ["Edible!", "Rock solid", "Turned to sugar"], fact: "Honey found in Egyptian tombs was still perfectly good after 3,000 years! 🍯" },
  { q: "How many bones are in the human body?", a: 2, choices: ["108 bones", "150 bones", "206 bones"], fact: "Adults have 206 bones! Babies are born with about 270 bones that fuse together as they grow! 🦴" },
  { q: "What can a snail do that seems impossible?", a: 1, choices: ["Jump very high", "Sleep for 3 years", "Run as fast as a dog"], fact: "Snails can sleep for up to 3 years during a drought! Talk about a long nap! 🐌" },

// ===== ACHIEVEMENTS =====
const ACHIEVEMENT_IDS = [];
Object.values(STORIES).forEach(story => {
  Object.entries(story.nodes).forEach(([id, node]) => {
    if (node.isEnding) ACHIEVEMENT_IDS.push(`${story.id}:${id}`);
  });
});

function getAchievements() {
  try {
    return JSON.parse(localStorage.getItem('kidgame_achievements') || '[]');
  } catch { return []; }
}

function saveAchievement(storyId, nodeId) {
  const key = `${storyId}:${nodeId}`;
  const achievements = getAchievements();
  if (!achievements.includes(key)) {
    achievements.push(key);
    localStorage.setItem('kidgame_achievements', JSON.stringify(achievements));
  }
}

// ===== GAME STATE =====
const state = {
  currentScreen: 'start',
  currentStory: null,
  currentNode: null,
  stepCount: 0,
  triviaStepInterval: 3,
  triviaScore: 0,
  pendingNext: null,
  usedTrivia: []
};

// ===== DOM REFERENCES =====
const screens = {
  start: document.getElementById('start-screen'),
  select: document.getElementById('select-screen'),
  game: document.getElementById('game-screen'),
  trivia: document.getElementById('trivia-screen'),
  triviaMode: document.getElementById('trivia-mode-screen'),
  mathMode: document.getElementById('math-mode-screen'),
  ending: document.getElementById('ending-screen'),
  achievements: document.getElementById('achievements-screen'),
  charades:     document.getElementById('charades-screen'),
  snake:        document.getElementById('snake-screen'),
  memory:       document.getElementById('memory-screen'),
  balloon:      document.getElementById('balloon-screen'),
  reaction:     document.getElementById('reaction-screen')
};

// ===== SCREEN NAVIGATION =====
function showScreen(name) {
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[name].classList.add('active');
  state.currentScreen = name;
  window.scrollTo(0, 0);
}

// ===== START GAME =====
function startGame() { showScreen('select'); }

// ===== SHOW ACHIEVEMENTS =====
function showAchievements() {
  renderAchievements();
  showScreen('achievements');
}

function renderAchievements() {
  const earned = getAchievements();
  const total = ACHIEVEMENT_IDS.length;
  const screen = screens.achievements;
  let html = `
    <div class="ach-header">
      <button class="back-btn" onclick="showScreen('start')">← Back</button>
      <h2 class="ach-title">🏆 Your Trophies</h2>
    </div>
    <p class="ach-subtitle">${earned.length} / ${total} endings found!</p>
    <div class="ach-progress-bar"><div class="ach-progress-fill" style="width:${Math.round(earned.length/total*100)}%"></div></div>
  `;
  Object.values(STORIES).forEach(story => {
    html += `<div class="ach-story-section"><h3 class="ach-story-title">${story.title}</h3><div class="ach-grid">`;
    Object.entries(story.nodes).forEach(([id, node]) => {
      if (!node.isEnding) return;
      const key = `${story.id}:${id}`;
      const found = earned.includes(key);
      html += `<div class="ach-item ${found ? 'found' : 'locked'}">
        <span class="ach-emoji">${found ? node.emoji : '🔒'}</span>
        <span class="ach-name">${found ? node.title : '???'}</span>
        ${found ? `<span class="ach-type-badge ${node.endingType === 'great' ? 'badge-great' : 'badge-good'}">${node.endingType === 'great' ? '⭐ Amazing' : '🎉 Great'}</span>` : ''}
      </div>`;
    });
    html += `</div></div>`;
  });
  screen.innerHTML = html;
}

// ===== PICK STORY =====
function pickStory(storyId) {
  state.currentStory = STORIES[storyId];
  state.currentNode = 'start';
  state.stepCount = 0;
  state.triviaScore = 0;
  showScreen('game');
  renderGameScreen();
}

// ===== RENDER GAME SCREEN =====
function renderGameScreen() {
  const story = state.currentStory;
  const node = story.nodes[state.currentNode];
  const gameScreen = screens.game;
  gameScreen.className = `screen active theme-${story.theme}`;
  gameScreen.innerHTML = `
    <div class="story-header">
      <button class="back-btn" onclick="goToSelect()">← Back</button>
      <span class="story-name-badge ${story.badge}">${story.title}</span>
      <span class="trivia-score-badge">⭐ ${state.triviaScore}</span>
    </div>
    <div class="progress-dots" id="progress-dots">${generateDots()}</div>
    <div class="scene-card" id="scene-card">
      <span class="scene-emoji">${node.emoji}</span>
      <h2 class="scene-title">${node.title}</h2>
      <p class="scene-text">${node.text}</p>
    </div>
    <div class="choices-container" id="choices-container">
      ${renderChoices(node)}
    </div>
  `;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const card = document.getElementById('scene-card');
    const choices = document.getElementById('choices-container');
    if (card) card.classList.add('visible');
    if (choices) choices.classList.add('visible');
  }));
}

function generateDots() {
  let html = '';
  for (let i = 0; i < 8; i++) {
    html += `<div class="dot ${i < state.stepCount ? 'filled' : ''}"></div>`;
  }
  return html;
}

function renderChoices(node) {
  if (!node.choices || node.choices.length === 0) return '';
  return node.choices.map(c =>
    `<button class="choice-btn" onclick="makeChoice('${c.next}')">${c.text}</button>`
  ).join('');
}

// ===== MAKE A CHOICE =====
function makeChoice(nextNodeId) {
  state.stepCount++;
  state.pendingNext = nextNodeId;

  // Show trivia every 3rd step
  if (state.stepCount % state.triviaStepInterval === 0) {
    showTrivia();
  } else {
    navigateToNode(nextNodeId);
  }
}

function navigateToNode(nodeId) {
  state.currentNode = nodeId;
  const node = state.currentStory.nodes[nodeId];
  if (node.isEnding) {
    saveAchievement(state.currentStory.id, nodeId);
    showEnding(node);
  } else {
    const card = document.getElementById('scene-card');
    const choices = document.getElementById('choices-container');
    if (card) card.classList.remove('visible');
    if (choices) choices.classList.remove('visible');
    setTimeout(() => renderGameScreen(), 300);
  }
}

// ===== TRIVIA =====
function getRandomTrivia() {
  const available = TRIVIA.filter((_, i) => !state.usedTrivia.includes(i));
  if (available.length === 0) {
    state.usedTrivia = [];
    return { item: TRIVIA[0], index: 0 };
  }
  const idx = Math.floor(Math.random() * available.length);
  const originalIndex = TRIVIA.indexOf(available[idx]);
  return { item: available[idx], index: originalIndex };
}

function showTrivia() {
  const { item, index } = getRandomTrivia();
  state.usedTrivia.push(index);
  const screen = screens.trivia;
  screen.innerHTML = `
    <div class="trivia-header">
      <span class="trivia-badge">🧠 Fun Fact Challenge!</span>
      <span class="trivia-score">⭐ ${state.triviaScore} stars</span>
    </div>
    <div class="trivia-card" id="trivia-card">
      <p class="trivia-question">${item.q}</p>
      <div class="trivia-choices" id="trivia-choices">
        ${item.choices.map((c, i) =>
          `<button class="trivia-btn" onclick="answerTrivia(${i}, ${item.a}, this)">${c}</button>`
        ).join('')}
      </div>
    </div>
    <p class="trivia-hint">Answer the question to continue your adventure!</p>
  `;
  showScreen('trivia');
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const card = document.getElementById('trivia-card');
    if (card) card.classList.add('visible');
  }));
}

function answerTrivia(chosen, correct, btn) {
  const btns = document.querySelectorAll('.trivia-btn');
  btns.forEach(b => b.disabled = true);

  const isCorrect = chosen === correct;
  if (isCorrect) {
    btn.classList.add('trivia-correct');
    state.triviaScore++;
  } else {
    btn.classList.add('trivia-wrong');
    btns[correct].classList.add('trivia-correct');
  }

  const item = TRIVIA[state.usedTrivia[state.usedTrivia.length - 1]];
  const factDiv = document.createElement('div');
  factDiv.className = `trivia-fact ${isCorrect ? 'fact-correct' : 'fact-wrong'}`;
  factDiv.innerHTML = `
    <p>${isCorrect ? '🎉 Correct!' : '🤔 Not quite!'}</p>
    <p class="fact-text">${item.fact}</p>
    <button class="btn-primary" onclick="continueAfterTrivia()" style="margin-top:16px">Continue Adventure! →</button>
  `;
  document.getElementById('trivia-card').appendChild(factDiv);
}

function continueAfterTrivia() {
  showScreen('game');
  navigateToNode(state.pendingNext);
}

// ===== SHOW ENDING =====
function showEnding(node) {
  const endingScreen = screens.ending;
  const isGreat = node.endingType === 'great';
  endingScreen.className = `screen active ${isGreat ? 'ending-bg-great' : 'ending-bg-good'}`;
  endingScreen.innerHTML = `
    <div class="ending-fireworks">${node.fireworks}</div>
    <span class="ending-badge ${isGreat ? 'badge-great' : 'badge-good'}">
      ${isGreat ? '⭐ Amazing Ending!' : '🎉 Great Ending!'}
    </span>
    <span class="ending-emoji">${node.emoji}</span>
    <h2 class="ending-title">${node.title}</h2>
    <p class="ending-text">${node.text}</p>
    <div class="trivia-final-score">
      <span>⭐ You earned ${state.triviaScore} trivia stars!</span>
    </div>
    <div class="ending-buttons">
      <button class="btn-primary" onclick="replayStory()">🔄 Play Again!</button>
      <button class="btn-secondary" onclick="pickDifferentStory()">🌟 Try Another Adventure</button>
      <button class="btn-secondary" onclick="showAchievements()">🏆 View Trophies</button>
      <button class="btn-secondary" onclick="showScreen('start')">🏠 Home</button>
    </div>
  `;
  showScreen('ending');
}

// ===== NAVIGATION HELPERS =====
function goToSelect() { showScreen('select'); }
function replayStory() { pickStory(state.currentStory.id); }
function pickDifferentStory() { showScreen('select'); }

// ===== STARS BACKGROUND =====
function createStars() {
  const container = document.querySelector('.stars');
  if (!container) return;
  for (let i = 0; i < 80; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    star.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;--dur:${Math.random()*3+2}s;--max-opacity:${Math.random()*0.5+0.2};animation-delay:${Math.random()*4}s;`;
    container.appendChild(star);
  }
}

function launchTrivia(category) {
  tmState.category = category;
  tmState.current = 0;
  tmState.correct = 0;
  tmState.wrong = 0;

  const pool = ALL_TRIVIA.filter(q => category === 'all' || q.cat === category);
  const shuffled = pool.sort(() => Math.random() - 0.5);
  tmState.questions = shuffled.slice(0, Math.min(10, shuffled.length));
  tmState.total = tmState.questions.length;

  renderTriviaQuestion();
}

  const q = tmState.questions[tmState.current];

  screen.innerHTML = `

function answerTriviaMode(chosen, correct, btn) {
  const btns = document.querySelectorAll('#tm-choices .trivia-btn');

  if (isCorrect) { btn.classList.add('trivia-correct'); tmState.correct++; }
  else { btn.classList.add('trivia-wrong'); btns[correct].classList.add('trivia-correct'); tmState.wrong++; }

  const q = tmState.questions[tmState.current];
  const card = document.querySelector('#trivia-mode-screen .trivia-card');

  factDiv.className = `trivia-fact ${isCorrect ? 'fact-correct' : 'fact-wrong'}`;

const mathState = {
  difficulty: 'easy',
  score: 0,
  streak: 0,
  questionNum: 0,
  total: 15,
  timeLeft: 15,
  timer: null,
  currentAnswer: 0
};

function startMathMode() {
  if (mathState.timer) { clearInterval(mathState.timer); mathState.timer = null; }
  const screen = screens.mathMode;
  screen.innerHTML = `
    <div class="mode-header">
      <button class="back-btn" onclick="showScreen('start')">← Back</button>
      <span class="mode-title-badge mode-title-badge-math">🔢 Math Challenge</span>
    </div>

    <div class="difficulty-grid">
      <button class="difficulty-btn diff-easy" onclick="launchMath('easy')">
        <span class="diff-emoji">🌱</span>
        <div class="diff-info"><div class="diff-name">Easy</div><div class="diff-desc">Add & subtract up to 20 · 20 seconds per question</div></div>
      </button>
      <button class="difficulty-btn diff-medium" onclick="launchMath('medium')">
        <span class="diff-emoji">🌟</span>
        <div class="diff-info"><div class="diff-name">Medium</div><div class="diff-desc">Add, subtract, multiply up to 50 · 15 seconds</div></div>
      </button>

        <span class="diff-emoji">🔥</span>
        <div class="diff-info"><div class="diff-name">Hard</div><div class="diff-desc">All operations up to 100 · 10 seconds</div></div>
      </button>
    </div>
    <p style="font-size:0.85rem;color:#9ca3af;text-align:center;margin-top:10px">15 questions · Race against the clock!</p>
  `;
  showScreen('mathMode');
}

function launchMath(difficulty) {
  mathState.difficulty = difficulty;
  mathState.score = 0;
  mathState.streak = 0;
  mathState.questionNum = 0;
  renderMathQuestion();
}

function generateMathQuestion() {
  const d = mathState.difficulty;
  const ops = d === 'easy' ? ['+', '-'] : d === 'medium' ? ['+', '-', '×'] : ['+', '-', '×', '÷'];
  const op = ops[Math.floor(Math.random() * ops.length)];
  let a, b, answer;

  const maxNum = d === 'easy' ? 20 : d === 'medium' ? 50 : 100;

  if (op === '+') {
    a = Math.floor(Math.random() * maxNum) + 1;
    b = Math.floor(Math.random() * maxNum) + 1;
    answer = a + b;
  } else if (op === '-') {
    a = Math.floor(Math.random() * maxNum) + 1;
    b = Math.floor(Math.random() * a) + 1;
    answer = a - b;
  } else if (op === '×') {
    const maxFactor = d === 'medium' ? 10 : 12;
    a = Math.floor(Math.random() * maxFactor) + 1;
    b = Math.floor(Math.random() * maxFactor) + 1;
    answer = a * b;
  } else { // ÷
    b = Math.floor(Math.random() * 11) + 2;
    answer = Math.floor(Math.random() * 10) + 1;
    a = b * answer;
  }

  return { problem: `${a} ${op} ${b} = ?`, answer };
}

function generateWrongAnswers(correct) {
  const wrongs = new Set();
  while (wrongs.size < 3) {
    const offset = Math.floor(Math.random() * 10) + 1;
    const wrong = Math.random() < 0.5 ? correct + offset : Math.max(0, correct - offset);
    if (wrong !== correct) wrongs.add(wrong);
  }
  return [...wrongs];
}

function renderMathQuestion() {
  if (mathState.questionNum >= mathState.total) {
    showMathResults();
    return;
  }

  const { problem, answer } = generateMathQuestion();
  mathState.currentAnswer = answer;

  const timeLimit = mathState.difficulty === 'easy' ? 20 : mathState.difficulty === 'medium' ? 15 : 10;
  mathState.timeLeft = timeLimit;
  if (mathState.timer) clearInterval(mathState.timer);

  const wrongs = generateWrongAnswers(answer);
  const allAnswers = [answer, ...wrongs].sort(() => Math.random() - 0.5);
  const pct = Math.round((mathState.questionNum / mathState.total) * 100);
  const streakMsg = mathState.streak >= 3 ? `🔥 ${mathState.streak} in a row!` : mathState.streak >= 2 ? `⚡ Streak: ${mathState.streak}!` : '';

  const screen = screens.mathMode;
  screen.innerHTML = `
    <div class="mode-header">
      <button class="back-btn" onclick="startMathMode()">← Back</button>
      <span class="mode-title-badge mode-title-badge-math">🔢 Math</span>
    </div>
    <div class="math-header">
      <span class="math-score-display">⭐ ${mathState.score} pts · Q${mathState.questionNum + 1}/${mathState.total}</span>
      <span class="math-timer-display timer-ok" id="math-timer">⏱️ ${mathState.timeLeft}s</span>
    </div>
    <div class="math-progress-bar"><div class="math-progress-fill" style="width:${pct}%"></div></div>
    <div class="math-question-card">
      <p class="math-problem">${problem}</p>
      <p class="math-streak">${streakMsg}</p>
    </div>
    <div class="math-answers">
      ${allAnswers.map(ans =>
        `<button class="math-btn" onclick="answerMath(${ans}, this)">${ans}</button>`
      ).join('')}
    </div>
    <div class="math-feedback" id="math-feedback"></div>
  `;

  mathState.timer = setInterval(() => {
    mathState.timeLeft--;
    const timerEl = document.getElementById('math-timer');
    if (!timerEl) { clearInterval(mathState.timer); return; }
    timerEl.textContent = `⏱️ ${mathState.timeLeft}s`;
    if (mathState.timeLeft <= 5) timerEl.className = 'math-timer-display timer-danger';
    else if (mathState.timeLeft <= 8) timerEl.className = 'math-timer-display timer-warn';

    if (mathState.timeLeft <= 0) {
      clearInterval(mathState.timer);
      timeOutMath();
    }
  }, 1000);
}

function answerMath(chosen, btn) {
  clearInterval(mathState.timer);
  const btns = document.querySelectorAll('.math-btn');
  btns.forEach(b => b.disabled = true);

  const isCorrect = chosen === mathState.currentAnswer;
  const timeBonus = mathState.difficulty === 'easy' ? 0 : mathState.timeLeft;
  const pts = isCorrect ? 10 + (mathState.streak * 2) + Math.floor(timeBonus / 3) : 0;

  if (isCorrect) {
    btn.classList.add('math-correct');
    mathState.score += pts;
    mathState.streak++;
    mathState.questionNum++;
    const fb = document.getElementById('math-feedback');
    if (fb) { fb.className = 'math-feedback feedback-correct'; fb.textContent = pts > 10 ? `🎉 +${pts} (streak bonus!)` : `✅ Correct! +${pts}`; }
    setTimeout(renderMathQuestion, 900);
  } else {
    btn.classList.add('math-wrong');
    btns.forEach(b => { if (parseInt(b.textContent) === mathState.currentAnswer) b.classList.add('math-correct'); });
    mathState.streak = 0;
    mathState.questionNum++;
    const fb = document.getElementById('math-feedback');
    if (fb) { fb.className = 'math-feedback feedback-wrong'; fb.textContent = `❌ The answer was ${mathState.currentAnswer}`; }
    setTimeout(renderMathQuestion, 1200);
  }
}

function timeOutMath() {
  const btns = document.querySelectorAll('.math-btn');
  btns.forEach(b => {
    b.disabled = true;
    if (parseInt(b.textContent) === mathState.currentAnswer) b.classList.add('math-correct');
  });
  mathState.streak = 0;
  mathState.questionNum++;
  const fb = document.getElementById('math-feedback');
  if (fb) { fb.className = 'math-feedback feedback-wrong'; fb.textContent = `⏰ Time's up! Answer: ${mathState.currentAnswer}`; }
  setTimeout(renderMathQuestion, 1200);
}

}

async function launchCharades(category) {
  charadesState.category = category;
  charadesState.score = 0;
  charadesState.skipped = 0;
  charadesState.timerSeconds = 60;
  charadesState.currentIndex = 0;
  charadesState.tiltCooldown = false;

  let pool = [];
  if (category === 'all') {
    Object.values(CHARADES_WORDS).forEach(arr => pool.push(...arr));
  } else {
    pool = [...CHARADES_WORDS[category]];
  }
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  charadesState.words = pool;

  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const perm = await DeviceOrientationEvent.requestPermission();
      charadesState.orientationGranted = (perm === 'granted');
    } catch (e) { charadesState.orientationGranted = false; }
  } else {
    charadesState.orientationGranted = true;
  }

  if (charadesState.orientationGranted) {
    window.addEventListener('deviceorientation', charadesHandleOrientation);
  }

  renderCharadesGame();
  charadesState.timerInterval = setInterval(() => {
    charadesState.timerSeconds--;
    const el = document.getElementById('charades-timer');
    if (el) {
      el.textContent = charadesState.timerSeconds;
      if (charadesState.timerSeconds <= 10) el.classList.add('urgent');
    }
    if (charadesState.timerSeconds <= 0) endCharades();
  }, 1000);
}

function renderCharadesGame() {
  const word = charadesState.words[charadesState.currentIndex] || '—';
  const cat = charadesState.category === 'all' ? detectCharadesCategory(word) : charadesState.category;
  screens.charades.innerHTML = `

        </div>

        <div style="text-align:center;">

    </div>`;
}

function detectCharadesCategory(word) {
  for (const [cat, words] of Object.entries(CHARADES_WORDS)) {
    if (words.includes(word)) return cat;
  }
  return 'silly';
}

function charadesHandleOrientation(e) {
  if (charadesState.tiltCooldown || charadesState.timerSeconds <= 0) return;
  const beta = e.beta;
  if (beta === null) return;
  if (beta > 50)   { charadesCorrect(true); }
  else if (beta < -20) { charadesSkip(true); }
}

function charadesCorrect(fromTilt = false) {
  if (charadesState.timerSeconds <= 0) return;
  charadesState.score++;
  charadesState.currentIndex++;
  charadesState.tiltCooldown = true;
  setTimeout(() => { charadesState.tiltCooldown = false; }, 1200);
  const scoreEl = document.getElementById('charades-score-val');
  if (scoreEl) scoreEl.textContent = charadesState.score;
  if (fromTilt) {
    const card = document.getElementById('charades-word-card');
    if (card) {
      card.style.background = 'linear-gradient(135deg, rgba(52,211,153,0.4), rgba(16,185,129,0.5))';
      setTimeout(() => { if (card) card.style.background = ''; }, 500);
    }
  }
  if (charadesState.currentIndex >= charadesState.words.length) { endCharades(); return; }
  charadesNextWord();
}

function charadesSkip(fromTilt = false) {
  if (charadesState.timerSeconds <= 0) return;
  charadesState.skipped++;
  charadesState.currentIndex++;
  charadesState.tiltCooldown = true;
  setTimeout(() => { charadesState.tiltCooldown = false; }, 1200);
  if (fromTilt) {
    const card = document.getElementById('charades-word-card');
    if (card) {
      card.style.background = 'linear-gradient(135deg, rgba(248,113,113,0.4), rgba(239,68,68,0.5))';
      setTimeout(() => { if (card) card.style.background = ''; }, 500);
    }
  }
  if (charadesState.currentIndex >= charadesState.words.length) { endCharades(); return; }
  charadesNextWord();
}

function charadesNextWord() {
  const word = charadesState.words[charadesState.currentIndex] || '—';
  const cat = charadesState.category === 'all' ? detectCharadesCategory(word) : charadesState.category;
  const wordEl = document.getElementById('charades-word');
  const pillEl = document.querySelector('.charades-category-pill');
  if (wordEl) {
    wordEl.style.opacity = '0';
    wordEl.style.transform = 'translateY(-8px)';
    setTimeout(() => {
      wordEl.textContent = word;
      wordEl.style.transition = 'opacity 0.2s, transform 0.2s';
      wordEl.style.opacity = '1';
      wordEl.style.transform = 'translateY(0)';
    }, 150);
  }
  if (pillEl) { pillEl.className = `charades-category-pill ${cat}`; pillEl.textContent = cat; }
}

function endCharades() {
  clearInterval(charadesState.timerInterval);
  window.removeEventListener('deviceorientation', charadesHandleOrientation);
  const total = charadesState.score + charadesState.skipped;
  const pct = total > 0 ? Math.round((charadesState.score / total) * 100) : 0;
  let medal = '🥉';
  if (pct >= 80) medal = '🥇';
  else if (pct >= 50) medal = '🥈';
  screens.charades.innerHTML = `
    <div style="padding:30px 16px 40px;max-width:480px;margin:0 auto;text-align:center;">
      <button class="back-btn" style="display:block;margin-bottom:20px;" onclick="showScreen('start')">← Back to Home</button>
      <div style="font-size:5rem;margin:10px 0;">${medal}</div>
      <h2 style="font-size:2rem;font-weight:900;color:#e9d5ff;margin-bottom:20px;">Time's Up!</h2>
      <div style="background:rgba(255,255,255,0.08);border-radius:16px;padding:16px;margin-bottom:10px;font-size:1.1rem;color:#c4b5fd;">
        ✅ Got It! &nbsp; <strong style="color:#fff;font-size:1.4rem;">${charadesState.score}</strong> words
      </div>
      <div style="background:rgba(255,255,255,0.08);border-radius:16px;padding:16px;margin-bottom:10px;font-size:1.1rem;color:#c4b5fd;">
        ❌ Skipped &nbsp; <strong style="color:#fff;font-size:1.4rem;">${charadesState.skipped}</strong> words
      </div>
      <div style="background:rgba(255,255,255,0.08);border-radius:16px;padding:16px;margin-bottom:20px;font-size:1.1rem;color:#c4b5fd;">
        🎯 Accuracy &nbsp; <strong style="color:#ffd700;font-size:1.4rem;">${pct}%</strong>
      </div>
      <button class="btn-primary" onclick="startCharades()">🔄 Play Again</button>
    </div>`;
}

const snakeState = {
  canvas: null, ctx: null, cells: 20, cellSize: 0,
  snake: [], dir: { x: 1, y: 0 }, nextDir: { x: 1, y: 0 },
  food: { x: 0, y: 0 }, score: 0,
  highScore: parseInt(localStorage.getItem('snakeHigh') || '0'),

function exitSnake() {

  document.removeEventListener('keydown', snakeKeyDown);

function initSnake() {
  const canvasSize = Math.min(window.innerWidth - 32, 320);
  screens.snake.innerHTML = `
    <div style="max-width:480px;margin:0 auto;display:flex;flex-direction:column;align-items:center;padding:10px 16px 20px;">
      <div class="snake-header" style="width:100%;max-width:${canvasSize}px;">

      </div>
