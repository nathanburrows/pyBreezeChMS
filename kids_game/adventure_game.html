        <canvas id="snake-canvas" width="${canvasSize}" height="${canvasSize}"></canvas>
      </div>
      <div class="dpad-grid">
        <div class="dpad-blank"></div>
        <button class="dpad-btn" ontouchstart="e=>{e.preventDefault();dpadPress('up')}" onclick="dpadPress('up')">▲</button>
        <div class="dpad-blank"></div>
        <button class="dpad-btn" ontouchstart="e=>{e.preventDefault();dpadPress('left')}" onclick="dpadPress('left')">◀</button>
        <div class="dpad-blank"></div>
        <button class="dpad-btn" ontouchstart="e=>{e.preventDefault();dpadPress('right')}" onclick="dpadPress('right')">▶</button>
        <div class="dpad-blank"></div>
        <button class="dpad-btn" ontouchstart="e=>{e.preventDefault();dpadPress('down')}" onclick="dpadPress('down')">▼</button>
        <div class="dpad-blank"></div>
      </div>
    </div>`;

  snakeState.canvas = document.getElementById('snake-canvas');
  snakeState.ctx = snakeState.canvas.getContext('2d');
  snakeState.cellSize = canvasSize / snakeState.cells;
  snakeState.score = 0;
  snakeState.dir = { x: 1, y: 0 };
  snakeState.nextDir = { x: 1, y: 0 };
  snakeState.gameOver = false;
  snakeState.running = true;

  const mid = Math.floor(snakeState.cells / 2);
  snakeState.snake = [{ x: mid, y: mid }, { x: mid-1, y: mid }, { x: mid-2, y: mid }];
  snakePlaceFood();

  snakeState.canvas.addEventListener('touchstart', snakeTouchStart, { passive: true });
  snakeState.canvas.addEventListener('touchend',   snakeTouchEnd,   { passive: true });
  document.addEventListener('keydown', snakeKeyDown);

  // D-pad buttons — use proper event listeners
  document.querySelectorAll('.dpad-btn').forEach(btn => {
    btn.addEventListener('touchstart', function(e) {
      e.preventDefault();
      const dir = this.getAttribute('data-dir');
      if (dir) dpadPress(dir);
    }, { passive: false });
  });

  snakeLoop();
}

function snakeGetSpeed() {
  if (snakeState.score >= 200) return 80;
  if (snakeState.score >= 100) return 110;
  if (snakeState.score >= 50)  return 140;
  return 180;
}

function snakeLoop() {
  if (!snakeState.running) return;
  snakeState.dir = { ...snakeState.nextDir };
  const head = { x: snakeState.snake[0].x + snakeState.dir.x, y: snakeState.snake[0].y + snakeState.dir.y };
  if (head.x < 0 || head.x >= snakeState.cells || head.y < 0 || head.y >= snakeState.cells) { snakeGameOver(); return; }
  if (snakeState.snake.some(seg => seg.x === head.x && seg.y === head.y)) { snakeGameOver(); return; }
  snakeState.snake.unshift(head);
  if (head.x === snakeState.food.x && head.y === snakeState.food.y) {
    snakeState.score += 10;
    const scoreEl = document.getElementById('snake-score');
    if (scoreEl) scoreEl.textContent = snakeState.score;
    if (snakeState.score > snakeState.highScore) {
      snakeState.highScore = snakeState.score;
      localStorage.setItem('snakeHigh', snakeState.highScore);
      const highEl = document.getElementById('snake-high');
      if (highEl) highEl.textContent = snakeState.highScore;
    }
    snakePlaceFood();
  } else {
    snakeState.snake.pop();
  }
  snakeDraw();
  snakeState.loopTimeout = setTimeout(snakeLoop, snakeGetSpeed());
}

function snakePlaceFood() {
  let pos;
  do {
    pos = { x: Math.floor(Math.random() * snakeState.cells), y: Math.floor(Math.random() * snakeState.cells) };
  } while (snakeState.snake.some(s => s.x === pos.x && s.y === pos.y));
  snakeState.food = pos;
}

function snakeDraw() {
  const { ctx, canvas, cellSize: cs, cells } = snakeState;
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = 'rgba(52,211,153,0.05)';
  for (let x = 0; x < cells; x++) for (let y = 0; y < cells; y++) {
    ctx.beginPath(); ctx.arc(x * cs + cs/2, y * cs + cs/2, 1, 0, Math.PI*2); ctx.fill();
  }
  ctx.font = `${Math.round(cs * 0.72)}px serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🍎', snakeState.food.x * cs + cs/2, snakeState.food.y * cs + cs/2);
  snakeState.snake.forEach((seg, i) => {
    const x = seg.x * cs, y = seg.y * cs, pad = 2, r = 4;
    const fade = Math.max(0.3, 1 - i * 0.03);
    const grad = ctx.createLinearGradient(x, y, x+cs, y+cs);
    if (i === 0) { grad.addColorStop(0, '#6ee7b7'); grad.addColorStop(1, '#34d399'); }
    else { grad.addColorStop(0, `rgba(52,211,153,${fade})`); grad.addColorStop(1, `rgba(16,185,129,${fade*0.7})`); }
    ctx.fillStyle = grad;
    const rx = x+pad, ry = y+pad, rw = cs-pad*2, rh = cs-pad*2;
    ctx.beginPath();
    ctx.moveTo(rx+r, ry); ctx.lineTo(rx+rw-r, ry); ctx.quadraticCurveTo(rx+rw, ry, rx+rw, ry+r);
    ctx.lineTo(rx+rw, ry+rh-r); ctx.quadraticCurveTo(rx+rw, ry+rh, rx+rw-r, ry+rh);
    ctx.lineTo(rx+r, ry+rh); ctx.quadraticCurveTo(rx, ry+rh, rx, ry+rh-r);
    ctx.lineTo(rx, ry+r); ctx.quadraticCurveTo(rx, ry, rx+r, ry); ctx.closePath(); ctx.fill();
    if (i === 0) {
      ctx.fillStyle = '#0a0a0f';
      const es = cs * 0.11;
      ctx.beginPath(); ctx.arc(x+cs*0.32, y+cs*0.3, es, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x+cs*0.68, y+cs*0.3, es, 0, Math.PI*2); ctx.fill();
    }
  });
}

function snakeGameOver() {
  snakeState.running = false;
  clearTimeout(snakeState.loopTimeout);
  document.removeEventListener('keydown', snakeKeyDown);
  const wrap = document.getElementById('snake-canvas-wrap');
  if (!wrap) return;
  const overlay = document.createElement('div');
  overlay.className = 'snake-overlay';
  overlay.innerHTML = `
    <div style="font-size:3rem;margin-bottom:8px;">💀</div>
    <h2 style="color:#fff;font-size:1.8rem;font-weight:900;margin-bottom:8px;">Game Over!</h2>
    <div style="color:#6ee7b7;margin-bottom:6px;">Score: <strong style="color:#fff">${snakeState.score}</strong></div>
    <div style="color:#fbbf24;margin-bottom:20px;">Best: <strong>${snakeState.highScore}</strong></div>
    <button class="btn-primary" onclick="initSnake()">▶ Play Again</button>
    <button class="back-btn" style="margin-top:12px;" onclick="exitSnake()">← Home</button>`;
  wrap.appendChild(overlay);
}

function dpadPress(dir) {
  const { x, y } = snakeState.dir;
  if (dir === 'up'    && y === 0)  snakeState.nextDir = { x:  0, y: -1 };
  if (dir === 'down'  && y === 0)  snakeState.nextDir = { x:  0, y:  1 };
  if (dir === 'left'  && x === 0)  snakeState.nextDir = { x: -1, y:  0 };
  if (dir === 'right' && x === 0)  snakeState.nextDir = { x:  1, y:  0 };
}

function snakeKeyDown(e) {
  const map = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right', w:'up', s:'down', a:'left', d:'right' };
  if (map[e.key]) { e.preventDefault(); dpadPress(map[e.key]); }
}

function snakeTouchStart(e) {
  const t = e.touches[0];
  snakeState.touchStart = { x: t.clientX, y: t.clientY };
}

function snakeTouchEnd(e) {
  if (!snakeState.touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - snakeState.touchStart.x;
  const dy = t.clientY - snakeState.touchStart.y;
  if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
  if (Math.abs(dx) > Math.abs(dy)) { dpadPress(dx > 0 ? 'right' : 'left'); }
  else { dpadPress(dy > 0 ? 'down' : 'up'); }
  snakeState.touchStart = null;
}

// ═══════════════════════════════════════════════════════
// ===== MEMORY MATCH GAME =====
// ═══════════════════════════════════════════════════════

const MEMORY_EMOJIS = ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐸','🐵','🐔','🐧','🦋','🌟','🍕','🎸','🚀','🌈','🍦','🎈'];

const memoryState = {
  cards: [], flipped: [], matched: new Set(),
  attempts: 0, startTime: null, timerInterval: null,
  locked: false, difficulty: 'easy'
};

function startMemory() {
  showScreen('memory');
  screens.memory.innerHTML = `
    <div style="padding:30px 16px 40px;max-width:480px;margin:0 auto;text-align:center;">
      <button class="back-btn" style="display:block;margin-bottom:20px;" onclick="showScreen('start')">← Back to Home</button>
      <div style="font-size:4rem;margin:10px 0;">🃏</div>
      <h2 style="font-size:1.8rem;font-weight:900;color:#93c5fd;margin-bottom:8px;">Memory Match</h2>
      <p style="color:#bfdbfe;margin-bottom:24px;">Flip cards to find matching pairs!</p>
      <button class="memory-diff-btn easy" onclick="initMemory('easy')">😊 Easy — 4×3 (6 pairs)</button>
      <button class="memory-diff-btn hard" onclick="initMemory('hard')">🔥 Hard — 4×4 (8 pairs)</button>
    </div>`;
}

function initMemory(difficulty) {
  memoryState.difficulty = difficulty;
  memoryState.flipped = [];
  memoryState.matched = new Set();
  memoryState.attempts = 0;
  memoryState.locked = false;
  clearInterval(memoryState.timerInterval);

  const pairs = difficulty === 'easy' ? 6 : 8;
  const cols  = 4;
  const rows  = difficulty === 'easy' ? 3 : 4;
  const chosen = MEMORY_EMOJIS.slice(0, pairs);
  let deck = [...chosen, ...chosen];
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  memoryState.cards = deck.map((emoji, idx) => ({ id: idx, emoji }));

  screens.memory.innerHTML = `
    <div style="padding:10px 16px 20px;max-width:480px;margin:0 auto;">
      <div class="memory-header">
        <div class="memory-stat"><div class="m-label">PAIRS</div><div class="m-value" id="mem-pairs">0/${pairs}</div></div>
        <div class="memory-stat"><div class="m-label">TIME</div><div class="m-value" id="mem-time">0s</div></div>
        <div class="memory-stat"><div class="m-label">TRIES</div><div class="m-value" id="mem-tries">0</div></div>
      </div>
      <div class="memory-grid ${difficulty}" id="memory-grid">
        ${deck.map((emoji, idx) => `
          <div class="memory-card" id="mc-${idx}" onclick="memoryFlip(${idx})">
            <div class="memory-card-inner">
              <div class="memory-card-front">❓</div>
              <div class="memory-card-back">${emoji}</div>
            </div>
          </div>`).join('')}
      </div>
      <div style="text-align:center;padding:10px 0;">
        <button class="back-btn" onclick="startMemory()">← Change Difficulty</button>
      </div>
    </div>`;

  memoryState.startTime = Date.now();
  memoryState.timerInterval = setInterval(() => {
    const el = document.getElementById('mem-time');
    if (el) el.textContent = Math.floor((Date.now() - memoryState.startTime) / 1000) + 's';
  }, 1000);
}

function memoryFlip(idx) {
  if (memoryState.locked || memoryState.matched.has(idx) || memoryState.flipped.includes(idx)) return;
  document.getElementById(`mc-${idx}`).classList.add('flipped');
  memoryState.flipped.push(idx);
  if (memoryState.flipped.length === 2) {
    memoryState.locked = true;
    memoryState.attempts++;
    const triesEl = document.getElementById('mem-tries');
    if (triesEl) triesEl.textContent = memoryState.attempts;
    const [a, b] = memoryState.flipped;
    if (memoryState.cards[a].emoji === memoryState.cards[b].emoji) {
      memoryState.matched.add(a); memoryState.matched.add(b);
      document.getElementById(`mc-${a}`).classList.add('matched');
      document.getElementById(`mc-${b}`).classList.add('matched');
      memoryState.flipped = [];
      memoryState.locked = false;
      const pairs = memoryState.difficulty === 'easy' ? 6 : 8;
      const pairsEl = document.getElementById('mem-pairs');
      if (pairsEl) pairsEl.textContent = `${memoryState.matched.size / 2}/${pairs}`;
      if (memoryState.matched.size === pairs * 2) setTimeout(memoryWin, 400);
    } else {
      setTimeout(() => {
        document.getElementById(`mc-${a}`)?.classList.remove('flipped');
        document.getElementById(`mc-${b}`)?.classList.remove('flipped');
        memoryState.flipped = [];
        memoryState.locked = false;
      }, 1000);
    }
  }
}

function memoryWin() {
  clearInterval(memoryState.timerInterval);
  const elapsed = Math.floor((Date.now() - memoryState.startTime) / 1000);
  const pairs = memoryState.difficulty === 'easy' ? 6 : 8;
  let stars = '⭐⭐⭐';
  if (memoryState.attempts > pairs * 2.5) stars = '⭐⭐';
  if (memoryState.attempts > pairs * 4)   stars = '⭐';
  screens.memory.innerHTML = `
    <div style="padding:40px 16px;max-width:480px;margin:0 auto;text-align:center;">
      <button class="back-btn" style="display:block;margin-bottom:20px;" onclick="showScreen('start')">← Back to Home</button>
      <div style="font-size:5rem;margin:10px 0;">🎉</div>
      <h2 style="font-size:2rem;font-weight:900;color:#93c5fd;margin-bottom:8px;">You Win!</h2>
      <div style="font-size:2rem;margin-bottom:16px;">${stars}</div>
      <div style="background:rgba(255,255,255,0.08);border-radius:16px;padding:14px;margin-bottom:10px;color:#bfdbfe;">⏱ Time &nbsp; <strong style="color:#fff">${elapsed}s</strong></div>
      <div style="background:rgba(255,255,255,0.08);border-radius:16px;padding:14px;margin-bottom:10px;color:#bfdbfe;">🎯 Attempts &nbsp; <strong style="color:#fff">${memoryState.attempts}</strong></div>
      <div style="background:rgba(255,255,255,0.08);border-radius:16px;padding:14px;margin-bottom:20px;color:#bfdbfe;">🃏 Pairs &nbsp; <strong style="color:#34d399">${pairs}/${pairs} ✓</strong></div>
      <button class="btn-primary" onclick="initMemory('${memoryState.difficulty}')">🔄 Play Again</button>
      <button class="btn-secondary" style="margin-top:10px;" onclick="startMemory()">Change Difficulty</button>
    </div>`;
}

// ═══════════════════════════════════════════════════════
// ===== BALLOON POP GAME =====
// ═══════════════════════════════════════════════════════

const BALLOON_EMOJIS_LIST = ['🎈','🎈','🎈','🎈','🎆','🎇','🪅','🎊'];
const balloonState = {
  score: 0, combo: 0, timeLeft: 30,
  timerInterval: null, spawnInterval: null, running: false, nextId: 0
};

function startBalloonPop() {
  showScreen('balloon');
  screens.balloon.innerHTML = `
    <div style="padding:40px 16px;max-width:480px;margin:0 auto;text-align:center;min-height:100vh;background:linear-gradient(180deg,#0c1445,#1a237e);">
      <button class="back-btn" style="display:block;margin-bottom:20px;" onclick="showScreen('start')">← Back to Home</button>
      <div style="font-size:3.5rem;margin:10px 0;">🎈🎈🎈</div>
      <h2 style="font-size:1.8rem;font-weight:900;color:#fca5a5;margin-bottom:8px;">Balloon Pop!</h2>
      <p style="color:#fecaca;margin-bottom:20px;line-height:1.6;">Tap balloons before they escape!<br>
        <span style="color:#fbbf24;">🎈 Balloon = +10 pts</span><br>
        <span style="color:#f87171;">💣 Bomb = -20 pts!</span><br>
        Combos multiply your score!</p>
      <button class="btn-primary" onclick="initBalloonPop()">▶ Let's Pop!</button>
    </div>`;
}

function initBalloonPop() {
  balloonState.score = 0;
  balloonState.combo = 0;
  balloonState.timeLeft = 30;
  balloonState.running = true;
  balloonState.nextId = 0;
  clearInterval(balloonState.timerInterval);
  clearInterval(balloonState.spawnInterval);

  screens.balloon.innerHTML = `
    <div style="padding:10px 16px;max-width:480px;margin:0 auto;">
      <div class="balloon-hud">
        <div class="balloon-hud-stat"><div class="b-label">SCORE</div><div class="b-value" id="balloon-score">0</div></div>
        <div class="balloon-hud-stat"><div class="b-label">TIME</div><div class="b-value" id="balloon-time">30</div></div>
        <div class="balloon-hud-stat"><div class="b-label">COMBO</div><div class="b-value combo" id="balloon-combo">x1</div></div>
      </div>
    </div>
    <div id="balloon-field"></div>`;

  balloonState.timerInterval = setInterval(() => {
    if (!balloonState.running) return;
    balloonState.timeLeft--;
    const el = document.getElementById('balloon-time');
    if (el) el.textContent = balloonState.timeLeft;
    if (balloonState.timeLeft <= 0) endBalloonPop();
  }, 1000);

  balloonState.spawnInterval = setInterval(() => {
    if (!balloonState.running) return;
    const elapsed = 30 - balloonState.timeLeft;
    const rate = Math.min(3, 1 + Math.floor(elapsed / 8));
    for (let i = 0; i < rate; i++) setTimeout(() => spawnBalloon(), i * 350);
  }, 1300);

  spawnBalloon();
}

function spawnBalloon() {
  if (!balloonState.running) return;
  const field = document.getElementById('balloon-field');
  if (!field) return;
  const isBomb = Math.random() < 0.12;
  const emoji = isBomb ? '💣' : BALLOON_EMOJIS_LIST[Math.floor(Math.random() * BALLOON_EMOJIS_LIST.length)];
  const id = balloonState.nextId++;
  const fieldW = field.clientWidth || 320;
  const left = 10 + Math.random() * (fieldW - 70);
  const duration = 3.5 + Math.random() * 2.5;

  const el = document.createElement('div');
  el.className = 'balloon-item';
  el.id = `balloon-${id}`;
  el.textContent = emoji;
  el.style.cssText = `left:${left}px;bottom:-60px;animation-duration:${duration}s;`;

  const pop = () => {
    if (!el.parentNode || el.classList.contains('popped')) return;
    el.classList.add('popped');
    const rect = el.getBoundingClientRect();
    const fieldRect = field.getBoundingClientRect();
    const floatEl = document.createElement('div');
    floatEl.className = 'balloon-score-float';
    floatEl.style.left = (rect.left - fieldRect.left + 10) + 'px';
    floatEl.style.top  = (rect.top  - fieldRect.top  - 10) + 'px';
    if (isBomb) {
      balloonState.score = Math.max(0, balloonState.score - 20);
      balloonState.combo = 0;
      floatEl.textContent = '-20 💥';
      floatEl.style.color = '#f87171';
    } else {
      balloonState.combo++;
      const mult = Math.min(balloonState.combo, 5);
      const pts = 10 * mult;
      balloonState.score += pts;
      floatEl.textContent = `+${pts}${mult > 1 ? ' x' + mult : ''}`;
      floatEl.style.color = mult > 1 ? '#fbbf24' : '#6ee7b7';
    }
    field.appendChild(floatEl);
    setTimeout(() => { if (floatEl.parentNode) floatEl.parentNode.removeChild(floatEl); }, 900);
    const scoreEl = document.getElementById('balloon-score');
    const comboEl = document.getElementById('balloon-combo');
    if (scoreEl) scoreEl.textContent = balloonState.score;
    if (comboEl) comboEl.textContent = `x${Math.min(balloonState.combo, 5) || 1}`;
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 400);
  };

  el.addEventListener('click', pop);
  el.addEventListener('touchstart', (e) => { e.preventDefault(); pop(); }, { passive: false });
  field.appendChild(el);
  setTimeout(() => {
    if (el.parentNode) {
      el.parentNode.removeChild(el);
      if (!isBomb) { balloonState.combo = 0; const c = document.getElementById('balloon-combo'); if (c) c.textContent = 'x1'; }
    }
  }, duration * 1000);
}

function endBalloonPop() {
  balloonState.running = false;
  clearInterval(balloonState.timerInterval);
  clearInterval(balloonState.spawnInterval);
  let rank = '🐌 Slow Popper';
  if (balloonState.score >= 300)      rank = '🏆 Balloon Master!';
  else if (balloonState.score >= 150) rank = '⭐ Great Popper!';
  else if (balloonState.score >= 80)  rank = '👍 Good Job!';
  screens.balloon.innerHTML = `
    <div style="padding:40px 16px;text-align:center;min-height:100vh;background:linear-gradient(180deg,#0c1445,#1a237e);">
      <button class="back-btn" style="display:block;margin-bottom:20px;" onclick="showScreen('start')">← Back to Home</button>
      <div style="font-size:4rem;margin:10px 0;">🎈</div>
      <h2 style="font-size:2rem;font-weight:900;color:#fca5a5;margin-bottom:8px;">Time's Up!</h2>
      <div style="font-size:1.3rem;color:#fecaca;margin-bottom:20px;">${rank}</div>
      <div style="background:rgba(255,255,255,0.1);border-radius:16px;padding:20px;margin-bottom:20px;">
        <div style="font-size:0.85rem;color:#fca5a5;text-transform:uppercase;letter-spacing:.1em;">Final Score</div>
        <div style="font-size:3rem;font-weight:900;color:#fbbf24;">${balloonState.score}</div>
      </div>
      <button class="btn-primary" style="background:linear-gradient(135deg,#f87171,#ef4444);" onclick="initBalloonPop()">🎈 Pop Again!</button>
    </div>`;
}

// ═══════════════════════════════════════════════════════
// ===== REACTION TEST GAME =====
// ═══════════════════════════════════════════════════════

const reactionState = {
  phase: 'idle', round: 0, totalRounds: 5,
  times: [], waitTimeout: null, startTime: null
};

function startReaction() {
  showScreen('reaction');
  reactionState.phase = 'idle';
  reactionState.round = 0;
  reactionState.times = [];
  clearTimeout(reactionState.waitTimeout);

  screens.reaction.innerHTML = `
    <div style="padding:16px;max-width:480px;margin:0 auto;display:flex;flex-direction:column;min-height:100vh;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <button class="back-btn" onclick="exitReaction()">← Back</button>
        <span style="font-size:0.9rem;font-weight:700;color:#c4b5fd;" id="reaction-round-label">Round 0/${reactionState.totalRounds}</span>
      </div>
      <div id="reaction-pad" class="idle" onclick="reactionTap()">
        <span class="reaction-emoji-big">⚡</span>
        <div class="reaction-main-text">Tap to Start!</div>
        <div class="reaction-sub-text">Test your reaction speed — ${reactionState.totalRounds} rounds</div>
      </div>
    </div>`;
}

function exitReaction() {
  clearTimeout(reactionState.waitTimeout);
  reactionState.phase = 'idle';
  showScreen('start');
}

function reactionTap() {
  const phase = reactionState.phase;
  if (phase === 'idle') { reactionBeginRound(); return; }
  if (phase === 'waiting') {
    clearTimeout(reactionState.waitTimeout);
    reactionState.phase = 'toosoon';
    const pad = document.getElementById('reaction-pad');
    if (pad) {
      pad.className = 'toosoon';
      pad.innerHTML = `<span class="reaction-emoji-big">😬</span><div class="reaction-main-text">Too Soon!</div><div class="reaction-sub-text">Wait for green... Tap to try again</div>`;
    }
    reactionState.waitTimeout = setTimeout(() => reactionBeginRound(), 1800);
    return;
  }
  if (phase === 'ready') {
    const elapsed = Date.now() - reactionState.startTime;
    reactionState.times.push(elapsed);
    reactionState.phase = 'idle';
    const pad = document.getElementById('reaction-pad');
    if (pad) {
      pad.className = 'idle';
      pad.innerHTML = `<span class="reaction-emoji-big">✅</span><div class="reaction-main-text">${elapsed} ms</div><div class="reaction-sub-text">Round ${reactionState.round}/${reactionState.totalRounds} — Tap for next</div>`;
    }
    const lbl = document.getElementById('reaction-round-label');
    if (lbl) lbl.textContent = `Round ${reactionState.round}/${reactionState.totalRounds}`;
    if (reactionState.round >= reactionState.totalRounds) { setTimeout(reactionShowResults, 1200); }
    else { reactionState.waitTimeout = setTimeout(() => reactionBeginRound(), 1200); }
  }
}

function reactionBeginRound() {
  if (reactionState.round >= reactionState.totalRounds) { reactionShowResults(); return; }
  reactionState.round++;
  reactionState.phase = 'waiting';
  const delay = 2000 + Math.random() * 4000;
  const pad = document.getElementById('reaction-pad');
  if (pad) {
    pad.className = 'waiting';
    pad.innerHTML = `<span class="reaction-emoji-big">🔴</span><div class="reaction-main-text">Get Ready...</div><div class="reaction-sub-text">Round ${reactionState.round}/${reactionState.totalRounds} — Wait for GREEN!</div>`;
  }
  const lbl = document.getElementById('reaction-round-label');
  if (lbl) lbl.textContent = `Round ${reactionState.round}/${reactionState.totalRounds}`;
  reactionState.waitTimeout = setTimeout(() => {
    reactionState.phase = 'ready';
    reactionState.startTime = Date.now();
    const p = document.getElementById('reaction-pad');
    if (p) {
      p.className = 'ready';
      p.innerHTML = `<span class="reaction-emoji-big">🟢</span><div class="reaction-main-text">TAP NOW!</div><div class="reaction-sub-text">GO GO GO!</div>`;
    }
  }, delay);
}

function reactionShowResults() {
  clearTimeout(reactionState.waitTimeout);
  reactionState.phase = 'done';
  const times = reactionState.times;
  if (!times.length) { startReaction(); return; }
  const avg = Math.round(times.reduce((a, b) => a + b, 0) / times.length);
  const best = Math.min(...times);
  let rank, rankColor;
  if (avg < 200)      { rank = '⚡ Lightning Fast!'; rankColor = '#fbbf24'; }
  else if (avg < 350) { rank = '🚀 Super Fast!';     rankColor = '#34d399'; }
  else if (avg < 500) { rank = '👍 Average Speed';   rankColor = '#60a5fa'; }
  else                { rank = '🐢 Keep Practicing'; rankColor = '#f87171'; }

  screens.reaction.innerHTML = `
    <div style="padding:16px;max-width:480px;margin:0 auto;min-height:100vh;overflow-y:auto;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <button class="back-btn" onclick="exitReaction()">← Back</button>
        <span style="font-size:0.9rem;font-weight:700;color:#c4b5fd;">${times.length}/${reactionState.totalRounds} rounds</span>
      </div>
      <div style="text-align:center;margin-bottom:20px;">
        <div style="font-size:1.8rem;font-weight:900;color:${rankColor};margin-bottom:6px;">${rank}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px;">
        ${times.map((t, i) => `<div class="reaction-result-row"><span>Round ${i+1}</span><span class="reaction-ms">${t} ms</span></div>`).join('')}
        <div class="reaction-result-row" style="background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.25);">
          <span>⚡ Average</span><span class="reaction-ms">${avg} ms</span>
        </div>
        <div class="reaction-result-row" style="background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.25);">
          <span>🏆 Best</span><span class="reaction-ms">${best} ms</span>
        </div>
      </div>
      <button class="btn-primary" onclick="startReaction()">🔄 Try Again</button>
    </div>`;
}
